name: Release crates.io

# Publishes the `openpylot` crate to crates.io.
#
# The web UI is embedded at compile time via rust-embed from `frontend/out`,
# which is gitignored as a build product but force-included in the published
# package by the `include` list in Cargo.toml. So the frontend MUST be built
# before `cargo publish` runs, or the crate ships a UI-less binary — that is
# why this workflow builds it rather than assuming it is there.
#
# How to release:
#   1. Add a crates.io API token as the repo secret CARGO_REGISTRY_TOKEN
#      (Settings → Secrets and variables → Actions → New repository secret).
#   2. Bump `version` in Cargo.toml and commit (with an up-to-date Cargo.lock).
#   3. Tag and push:  git tag v0.2.0 && git push origin v0.2.0
#
# Run it manually (Actions tab → Run workflow) to do a `--dry-run` without
# publishing anything.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Must happen before publish: `frontend/out` is a build product that the
      # crate embeds, and an absent one produces a binary with no web UI.
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # cargo bundles every README/LICENSE it finds under the crate directory
      # on top of the `include` list, so a populated node_modules would add
      # hundreds of stray files to the package.
      - name: Drop frontend node_modules
        run: rm -rf frontend/node_modules

      - name: Verify the frontend was embedded
        run: |
          test -f frontend/out/index.html \
            || { echo "frontend/out/index.html missing — the crate would ship without a UI"; exit 1; }

      # Tag push → publish for real. Manual run → dry-run only (safety).
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo publish --locked --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Dry run (manual trigger)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: cargo publish --locked --allow-dirty --dry-run
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
