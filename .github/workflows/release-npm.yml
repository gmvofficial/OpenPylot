name: Release npm (NAPI)

# Builds the openpylot NAPI native addon (`.node`) for macOS, Linux and Windows
# and publishes them to npm as the `openpylot` package plus its per-platform
# optional dependencies (openpylot-darwin-arm64, …).
#
# The per-platform package directories are generated by `napi prepublish` from
# the `napi.triples` block in node/package.json, so they are not committed.
#
# How to release:
#   1. Add an npm automation token as the repo secret NPM_TOKEN
#      (Settings → Secrets and variables → Actions → New repository secret).
#   2. Bump `version` in node/package.json (including its optionalDependencies)
#      and node/Cargo.toml.
#   3. Tag and push:  git tag np-v0.2.0 && git push origin np-v0.2.0
#
# Run it manually (Actions tab → Run workflow) with dry_run=true to build every
# platform without publishing.

on:
  push:
    tags:
      - 'np-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build all platforms but do not publish'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # One platform failing should not hide whether the others built.
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: x86_64-apple-darwin
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: napi-${{ matrix.target }}

      - name: Install npm deps
        working-directory: node
        run: npm install

      # The parent crate embeds `frontend/out` with rust-embed, which fails to
      # compile if the directory is absent. A tracked `.gitkeep` normally keeps
      # it there; this makes the build independent of that file surviving.
      - name: Ensure the embed directory exists
        run: mkdir -p frontend/out && touch frontend/out/.gitkeep

      - name: Build native addon
        working-directory: node
        run: npx napi build --platform --release --target ${{ matrix.target }}

      - name: Upload addon artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: node/*.node
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm deps
        working-directory: node
        run: npm install

      - name: Download all addon artifacts
        uses: actions/download-artifact@v4
        with:
          path: node/artifacts

      - name: Move addons into per-platform packages
        working-directory: node
        run: npx napi artifacts --dir artifacts

      - name: List what will be published
        working-directory: node
        run: ls -R npm

      - name: Publish (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        working-directory: node
        run: npx napi prepublish -t npm --skip-gh-release --dry-run

      - name: Publish to npm
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        working-directory: node
        run: |
          npx napi prepublish -t npm --skip-gh-release
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
